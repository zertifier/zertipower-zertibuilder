# ===================================================================
# Documentación técnica Zertipower / Ris3CAT
# ===================================================================
# Pensado para un servidor con nginx-proxy + acme-companion, que es lo
# que detectan las variables VIRTUAL_HOST / LETSENCRYPT_HOST.
#
# Cómo funciona: nginx-proxy vigila el socket de Docker y, al ver un
# contenedor con VIRTUAL_HOST, genera solo el vhost y recarga Nginx.
# acme-companion hace lo propio con el certificado TLS. No hay que
# tocar ningún archivo de configuración en el servidor.
#
# Por eso el contenedor NO publica puertos: nginx-proxy llega a él por
# la red interna de Docker. Publicar un puerto sería exponerlo por
# fuera del proxy sin necesidad.
#
# Uso en Portainer (Stacks -> Add stack -> Repository):
#   Compose path: docs/docker-compose.yml
#   Variables:    ver .env.example
# ===================================================================

services:
  docs-ris3cat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Se fijan al COMPILAR: Docusaurus incrusta la URL en el HTML.
        DOCS_URL: ${DOCS_URL:-https://ris3cat-docs.zdevutils.com}
        DOCS_BASE_URL: ${DOCS_BASE_URL:-/}
    image: zertipower/docs-ris3cat:latest
    restart: unless-stopped

    environment:
      # --- Enrutado automático (nginx-proxy) ---------------------------
      # Dominio que servirá este contenedor.
      VIRTUAL_HOST: ${VIRTUAL_HOST:-ris3cat-docs.zdevutils.com}

      # Puerto en el que escucha Nginx DENTRO del contenedor.
      # Es 80, no el puerto del anfitrión: nginx-proxy se conecta por la
      # red interna de Docker, no por el puerto publicado.
      VIRTUAL_PORT: ${VIRTUAL_PORT:-80}

      # --- Certificado TLS automático (acme-companion) -----------------
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-ris3cat-docs.zdevutils.com}
      # Correo para los avisos de caducidad de Let's Encrypt. Puede estar
      # ya definido de forma global en el contenedor de acme-companion;
      # en ese caso esta variable es opcional.
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}

    networks:
      - proxy

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    logging:
      # Sin límite, los logs de un contenedor de larga duración acaban
      # llenando el disco del servidor.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    # La red la crea el stack del proxy, no este: por eso es `external`.
    # En este servidor es `docker_default`, la red del stack `docker`,
    # que es donde viven nginx-proxy y acme-companion.
    # Comprobarlo con:  docker network ls
    external: true
    name: ${PROXY_NETWORK:-docker_default}
