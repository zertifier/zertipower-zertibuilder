server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Nginx redirige /ruta -> /ruta/ para servir el index.html del
    # directorio. Por defecto construye una URL ABSOLUTA con el puerto en
    # el que escucha (80), lo que rompe el enlace cuando el contenedor se
    # publica en otro puerto o detrás de un proxy. Con redirecciones
    # relativas se conserva el host y el puerto que ve el cliente.
    absolute_redirect off;

    # Docusaurus genera un index.html por página.
    # `=404` es importante: sin él, una URL inexistente devolvería la
    # página de error con código 200 y los buscadores la indexarían como
    # contenido válido.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Se sirve la página 404 propia de Docusaurus, pero con código 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Los assets llevan hash en el nombre, así que se pueden cachear de
    # forma agresiva sin riesgo de servir una versión antigua.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El HTML no lleva hash: no debe cachearse, o los usuarios seguirían
    # viendo documentación desactualizada tras un despliegue.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
