server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Angular es una SPA: el enrutado lo hace el navegador. Sin este
    # try_files, recargar cualquier ruta interna (p. ej. /communities)
    # devolvería 404 porque ese archivo no existe en el disco.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los bundles llevan hash en el nombre: se pueden cachear para
    # siempre sin riesgo de servir una versión antigua.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html NO lleva hash: si se cachea, los usuarios se quedan con
    # una versión antigua de la aplicación tras cada despliegue.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
}
