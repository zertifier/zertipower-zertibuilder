# ===================================================================
# Proxy inverso para ris3cat-docs.zdevutils.com
# ===================================================================
# Va en el servidor anfitrión (NO dentro del contenedor), en:
#   /etc/nginx/sites-available/ris3cat-docs.zdevutils.com
#
# Activarlo:
#   sudo ln -s /etc/nginx/sites-available/ris3cat-docs.zdevutils.com \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Después, el certificado TLS:
#   sudo certbot --nginx -d ris3cat-docs.zdevutils.com
#
# Certbot reescribe este archivo añadiendo el bloque 443 y la
# redirección desde el 80. No hace falta escribirlos a mano.
#
# REQUISITO PREVIO: un registro DNS A (o AAAA) para
# ris3cat-docs.zdevutils.com apuntando a la IP del servidor. Sin él,
# certbot no puede validar el dominio y falla.
# ===================================================================

server {
    listen      80;
    listen [::]:80;
    server_name ris3cat-docs.zdevutils.com;

    # El contenedor publica en 127.0.0.1:8080 (ver docker-compose.yml).
    # Sólo escucha en local: el único camino de entrada es este proxy.
    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Imprescindible: sin esto el sitio no sabe que se sirve por
        # HTTPS y puede generar redirecciones hacia http://.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
    }

    # El sitio es estático: no necesita subidas grandes.
    client_max_body_size 1m;

    access_log /var/log/nginx/ris3cat-docs.access.log;
    error_log  /var/log/nginx/ris3cat-docs.error.log;
}
